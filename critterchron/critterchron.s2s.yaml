# critterchron — Stra2us KV catalog.
#
# Describes the tunable variables this app exposes through Stra2us. NOT a
# code generator — the C++ source (hal/particle/src/) is the truth for
# what the device actually reads; this file is the human-readable catalog
# tooling uses for `list / show / set / validate / publish`.
#
# Authoritative rule for the on-device resolution order is in
# hal/particle/src/Stra2usClient.cpp: first `<app>/<device>/<key>`, then
# `<app>/<key>`, then the compiled-in default. Absent keys fall through;
# **never** materialize placeholder entries to "pre-register" a key — an
# empty-string placeholder wins the probe at device scope and breaks
# fallback. See stra2us-cli (`pip install stra2us-cli` from the stra2us
# repo `tools/` dir) for the CLI that reads this file.
#
# `type` / `default` drift between this file and the C++ get_int /
# get_float call sites is enforced by test_s2s_catalog.py. When adding a
# new knob to the device, add its entry here in the same commit.
#
# Schema reference: stra2us/docs/catalog_spec.md

app: critterchron

# Customer-facing app view (Stra2us /app/<app>/<device>/) configuration.
# `telemetry_topic` is what the app view tails for "is this device alive";
# matches the publish topic the firmware uses (STRA2US_TELEMETRY_TOPIC,
# derived from STRA2US_APP at preprocessor time). `{app}` placeholder is
# substituted by the app view at runtime. `heartbeat_interval_seconds`
# matches HEARTBEEP_DEFAULT and drives the app view's "Online / Recently
# active / Offline" status thresholds (Online if last message < 2× interval).
telemetry_topic: "{app}/public/heartbeep"
heartbeat_interval_seconds: 300

# Scope legend:
#   app     — `<app>/<key>`           — fleet-wide default for this key
#   device  — `<app>/<device>/<key>`  — per-unit override
# Most knobs list both; some (the IR pointer) only make sense at one.
#
# `label:` field on a var marks it as customer-facing in the /app view.
# Vars without a label stay internal/ops-only.

vars:
  # ---------- telemetry cadence ----------

  heartbeep:
    label: "Telemetry interval"
    type: int
    default: 300
    scope: [app, device]
    range: [10, 3600]
    help: |
      How often the device reports status to the cloud, in seconds.

      Lower values give faster status updates at the cost of more network
      traffic. Device reads this each loop and adjusts live. Per-device
      headers may override the compiled-in default (e.g. ricky=15 for dev).

  cloud_heartbeep:
    type: int
    default: 300
    scope: [app, device]
    range: [10, 3600]
    help: |
      Particle cloud heartbeat cadence in seconds.

      Independent of Stra2us. Separate so broken Stra2us can't silence the
      observability path — answers "server down or device misconfigured?"
      from the Particle event stream alone.

  # ---------- OTA IR ----------

  ir:
    label: "Active script"
    type: string
    scope: [device]
    help: |
      Script name this device should run (e.g. "thyme").

      Empty string = "keep current, boot into compiled-in default on
      next reset." Not app-scoped: pointing every device at one script
      would ignore per-device grid geometry (rachel 32x8 vs ricky 16x16
      vs rico 8x8). Managed by tools/set_ir_pointer.py.
    ops_only: true    # device never calls get_*; read by Stra2usClient directly

  ir_poll_interval:
    type: int
    default: 1200
    scope: [app, device]
    range: [30, 86400]
    help: |
      Seconds between IR-script pointer-poll cycles.

      Decoupled from heartbeep because pointer changes propagate at human
      scale. Short values (< 60s) are fine for dev; in production the
      traffic is "one sidecar GET per device per interval" so 1200s is
      the sweet spot.

      Secondary use (added 2026-04-28): also paces the WiFi reconnect
      kick — when the device's radio is offline, the tel thread/task
      will call WiFi.reconnect() at most once per `ir_poll_interval`
      seconds (with a `!WiFi.connecting()` guard on Particle; ESP32
      has no equivalent primitive and relies on the cadence alone).
      Active on NO_IR_OTA devices too — rico's the device most prone
      to wedged-radio recovery, despite having OTA disabled. If a
      future need calls for tuning the two cadences independently,
      file a `wifi_reconnect_interval` key separately rather than
      coupling them through this one. Heartbeat surfaces each kick
      as `err=net:reconnect_kick offline=Nms`.

  fw_target:
    type: string
    scope: [app, device]
    help: |
      Target firmware identifier the device should pull.

      Matches the suffix used by `tools/publish_fw.py --target <name>`;
      today the only shipped value is `esp32c3` (timmy's platform).
      Empty / unset means "no firmware OTA — keep running whatever's
      flashed." Device-then-app fallback: per-device override wins,
      otherwise fleet-wide. Pulled on next `fw_poll_interval` cycle
      and on cold boot.
    ops_only: true    # device reads via Stra2usClient::fw_poll(), not get_int/get_float

  fw_poll_interval:
    type: int
    default: 86400
    scope: [app, device]
    range: [60, 604800]
    help: |
      Seconds between firmware OTA poll cycles.

      Decoupled from `ir_poll_interval` because firmware updates are
      rare (typically weekly at most). Borrowing the IR cadence here
      would generate hundreds of needless sidecar GETs per device per
      day. 86400s = 1 day. Floor 60s in the task loop for testing
      convenience. ESP32-only today; Particle firmware OTA goes through
      Particle Cloud, not this path.

  # ---------- WobblyTime ----------

  wobble_min_seconds:
    label: "Time wobble: min phase length"
    type: int
    default: 120
    scope: [app, device]
    range: [10, 3600]
    help: |
      Shortest possible duration of each clock-wobble phase, in seconds.

      Each phase's actual length is randomly chosen from [min, max].
      Larger values feel more meditative; smaller, more jittery.

  wobble_max_seconds:
    label: "Time wobble: max phase length"
    type: int
    default: 300
    scope: [app, device]
    range: [10, 3600]
    help: |
      Longest possible duration of each clock-wobble phase, in seconds.

      Each phase's actual length is randomly chosen from [min, max].
      Must be ≥ min; device doesn't range-check.

  wobble_fast_rate:
    label: "Time wobble: fast multiplier"
    type: float
    default: 1.3
    scope: [app, device]
    range: [0.5, 5.0]
    help: Time multiplier during a "fast" wobble phase. 1.0 = real time.

  wobble_slow_rate:
    label: "Time wobble: slow multiplier"
    type: float
    default: 0.7
    scope: [app, device]
    range: [0.1, 1.0]
    help: Time multiplier during a "slow" wobble phase. 1.0 = real time.

  # ---------- Light sensor + brightness ----------

  light_exponent:
    type: float
    default_per_platform: true
    scope: [app, device]
    range: [0.1, 5.0]
    help: |
      Exponent on normalized light reading before mapping to brightness.

      Higher = darker mid-range (stronger perceived dimming in twilight).
      Semantics invert by sensor type, so the compiled-in default does too:
        - CDS (Particle): raw→n is inverted (lower raw = more light),
          so default 2.5 pushes mid-range darker. See hal/particle/src/
          LightSensor.h.
        - BH1750 (ESP32): direct (more lux = more light), so the
          ESPHome-style sqrt (default 0.5) is the "bedroom" curve.
          See hal/esp32/src/LightSensorBH1750.h.
      Same key shared across drivers so a cross-device tune reaches both;
      useful values just differ per platform — hence no catalog literal.
      See stra2us docs/catalog_spec.md §2.3 for the per-platform origin.

  light_lux_full:
    type: float
    default: 375.0
    scope: [app, device]
    range: [1.0, 65535.0]
    help: |
      Lux reading at which BH1750-driven brightness saturates at max.

      Mapping is `target = min_b + clamp((lux/lux_full)^light_exponent,
      0, 1) * span`. 375 ≈ "bright room" per the ESPHome BH1750 recipe
      this port models. Smaller → reaches full bright sooner; larger →
      needs more light to saturate. ESP32/BH1750-only knob — the CDS
      path auto-calibrates and has no equivalent tunable. See
      hal/esp32/src/LightSensorBH1750.h.

  min_brightness:
    label: "Minimum brightness"
    type: int
    default_per_device: true
    scope: [app, device]
    range: [1, 255]
    help: |
      Lowest the panel can dim to (0-255 scale).

      Smoothed sensor input maps the bright/dark range onto [min, max].
      Compiled-in default is per-device (rachel=1, ricky=3, rico=32).
      Floor is 1; 0 is a sentinel reserved elsewhere
      (see `night_enter_brightness`).

  max_brightness:
    label: "Maximum brightness"
    type: int
    default_per_device: true
    scope: [app, device]
    range: [1, 255]
    help: |
      Highest the panel can brighten to (0-255 scale).

      Smoothed sensor input maps the bright/dark range onto [min, max].
      Per-device default (rachel=64, ricky=128, rico=128, elk=128).

  night_enter_brightness:
    label: "Night mode threshold (turn on)"
    type: int
    default_per_device: true
    scope: [app, device]
    range: [0, 255]
    help: |
      When ambient gets this dim, switch to the night-mode palette.

      Schmitt hysteresis against `night_exit_brightness` (which must be
      higher) prevents flicker. 0 disables night mode entirely (force
      day palette regardless of ambient). Defaults to MIN_BRIGHTNESS
      per device. Live-flipping from any positive value to 0 exits
      night mode immediately.

  night_exit_brightness:
    label: "Night mode threshold (turn off)"
    type: int
    default_per_device: true
    scope: [app, device]
    range: [0, 255]
    help: |
      When ambient gets this bright, switch back to the day-mode palette.

      Must be higher than `night_enter_brightness` to give the Schmitt
      trigger working hysteresis. Device clamps to enter+1 on read if
      misconfigured.

  # ---------- Network latency display ----------

  latency_display:
    label: "Show network latency on panel"
    type: int
    default: 0
    scope: [app, device]
    range: [0, 1]
    help: |
      Show a rolling network-latency graph on the bottom row of the panel.

      0 = off; 1 = on. Each heartbeat draws one pixel at the right edge
      and scrolls the row left, colored by this cycle's mean latency:
      ≤20ms bright green, fading dim through 200ms, then red beyond.
      Renders behind agents — they occlude the graph rather than the
      reverse. Useful for spotting "the network is acting up" at a
      glance.

      Source samples: every publish() and small kv_fetch_* contributes
      one elapsed-ms sample. Streaming OTA fetches are excluded so a
      1MB firmware pull doesn't dominate the metric. Operator regulates
      the visible time-window via heartbeep cadence (longer cadence =
      wider history per pixel). Available on both Particle and ESP32.

  # ---------- Brightness schedule ----------

  brightness_schedule:
    label: "Brightness schedule"
    type: string
    scope: [app, device]
    help: |
      Time-of-day brightness override.

      Comma-separated segments, up to 8, first match wins, wraparound
      handled (start > end crosses midnight). Two segment shapes:
        HH:MM-HH:MM:max         override max only (min unchanged)
        HH:MM-HH:MM:min-max     pin both ends (hard-clamp; bedtime "1-1")
      Examples: "23:00-07:00:1, 07:00-09:00:16, 09:00-23:00:64"
                "23:00-07:00:1-1, 07:00-23:00:64"
      Sensor smoothing still applies; segment transitions fade ~10s.
      Empty = off. Malformed segment rejects whole schedule (heartbeat
      shows `bri=(...sched-err)` + errlog). Active = `bri=(...sched)`.
      Side effect: clamping max below `night_enter_brightness` engages
      night palette via the existing Schmitt — no separate knob needed.
    ops_only: true

  # ---------- Procyon rescue WiFi: KV-driven cred install ----------

  wifi_ssid:
    label: "WiFi network name"
    type: string
    scope: [app, device]
    help: |
      The WiFi network this device should join.

      Used by the procyon rescue-recovery flow: set this (with
      `wifi_password`) before shipping the device, and during install
      the device will self-configure via the `procyon`/`horology`
      emergency hotspot. Empty = no override active; existing creds
      remain. Device-side dedup means leaving this set after install
      is harmless. See PROCYON.md.
    ops_only: true    # device reads via Stra2usClient::wifi_ssid()

  wifi_password:
    label: "WiFi password"
    type: string
    scope: [app, device]
    encrypted: true   # MUST be set with `stra2us set ... --encrypted`
    widget: secret
    help: |
      Password for the WiFi network named in `wifi_ssid`.

      WPA2-PSK assumed (covers ~all home/office networks). Encrypted
      on the wire to the device. Empty = no override active. See
      PROCYON.md for the rescue-recovery flow that uses this.
      Operators must set with `--encrypted`; bare `set` demotes to
      plaintext, which the catalog drift test rejects (any
      /password|secret|key/i key must be marked encrypted).
    ops_only: true    # device reads via Stra2usClient::wifi_password()
