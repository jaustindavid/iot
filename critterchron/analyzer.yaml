# Live analyzer config. Started from analyzer.example.yaml; edit
# freely as you tune. Add to .gitignore if you don't want it tracked.

queues:
  - topic: critterchron/public/heartbeep
    label: staging
  # Add the staging-prefix topic here once it's in use:
  # - topic: critterchron/staging/heartbeep
  #   label: staging-prefix

poll_interval_seconds: 5.0

storage_path: analyzer.sqlite
metrics_retention_seconds: 86400

# Suppress sink (log/webhook) re-emit of the same (device, rule) alert
# within this window. sqlite alert log is unaffected — every alert is
# persisted for "when did this start" queries.
alert_dedup_seconds: 60

threshold_rules:
  - metric: mem_min
    op: "<"
    value: 5000
    name: heap_low
    auto_dump: true

  - metric: rssi
    op: "<"
    value: -85
    name: wifi_marginal
    auto_dump: false

  # Replaces the former phys_max_us fleet rule. Mixed-chip-class fleet
  # (C3 + C6) has different per-chip baselines for timing metrics, so
  # MAD across all of them is noise. Absolute ceiling is chip-agnostic:
  # 100000us = 80% of the default 125ms physics budget. Re-tune (or
  # restore the fleet rule) once the fleet is homogenized — see TODO.md.
  - metric: phys_max_us
    op: ">"
    value: 100000
    name: phys_budget_saturated
    auto_dump: false

fleet_rules:
  - metric: seeks_fail
    mad_multiplier: 6.0
    min_devices: 3
    freshness_seconds: 300
    auto_dump: true

# Staleness rules: catches the "frozen engine, live heartbeat" class —
# values bit-identical across N samples while up= advances. See
# debug_frozen_engine_live_heartbeat memory note for the failure-mode
# signature this is built to catch.
staleness_rules:
  - metric: phys_max_us
    min_unchanged_samples: 5
    require_up_advancing: true
    auto_dump: true

  - metric: interp_max_us
    min_unchanged_samples: 5
    require_up_advancing: true
    auto_dump: false

sinks:
  - type: log
    level: WARNING

# §1 isn't shipped yet — leave auto_dump disabled until devices know
# how to consume `dump_now`. Flipping it earlier just writes orphan
# KV keys, which is harmless but noisy.
auto_dump:
  enabled: true
  app: critterchron
  cooldown_seconds: 600
